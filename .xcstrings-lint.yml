# xcstrings-lint's own configuration.
#
# This repository ships an action, not an app, so the only well-formed catalog
# it contains is the clean test fixture. Pointing at it means a zero-config run
# of the action here checks something real -- and keeps the file honest as a
# worked example. Everything else under __tests__/fixtures is deliberately
# broken test data; the self-check workflow points at that on purpose, using
# its own config files.
paths:
  - '__tests__/fixtures/project-clean/**/*.xcstrings'

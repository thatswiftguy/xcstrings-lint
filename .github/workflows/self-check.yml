name: Self-check

# The action runs against its own fixtures on every change. This is the best
# smoke test available -- it exercises the real bundle in a real runner -- and
# it doubles as a live, always-current usage example.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  passes-on-a-clean-project:
    name: clean project passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: check
        uses: ./
        with:
          config: .github/self-check/clean.yml
          threshold: 100
          comment: false

      - name: Assert it reported a pass
        run: |
          test "${{ steps.check.outputs.passed }}" = "true" \
            || { echo "::error::expected passed=true, got '${{ steps.check.outputs.passed }}'"; exit 1; }
          test "${{ steps.check.outputs.issue-count }}" = "0" \
            || { echo "::error::expected 0 issues, got '${{ steps.check.outputs.issue-count }}'"; exit 1; }
          test "${{ steps.check.outputs.files-scanned }}" -gt 0 \
            || { echo "::error::the globs matched nothing; the check was a no-op"; exit 1; }

  finds-every-issue-class:
    name: broken project fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: check
        uses: ./
        with:
          config: .github/self-check/broken.yml
          threshold: 100
          comment: false
          # The fixtures are broken on purpose; we assert on the outputs
          # instead of on the job failing.
          fail: false

      - name: Assert it caught them
        run: |
          test "${{ steps.check.outputs.passed }}" = "false" \
            || { echo "::error::expected passed=false"; exit 1; }
          test "${{ steps.check.outputs.issue-count }}" -gt 0 \
            || { echo "::error::expected issues to be found"; exit 1; }
          test "${{ steps.check.outputs.warning-count }}" -gt 0 \
            || { echo "::error::expected warnings to be found"; exit 1; }
          echo '${{ steps.check.outputs.coverage }}' | grep -q '"de"' \
            || { echo "::error::coverage output is missing German"; exit 1; }

      - name: Assert the report names each kind of problem
        run: |
          cat <<'REPORT' > report.md
          ${{ steps.check.outputs.report }}
          REPORT
          grep -q 'xcstrings-lint' report.md || { echo "::error::report is empty"; exit 1; }
          for pattern in 'format specifier\|expected %lld' 'Missing translations' 'Duplicate keys'; do
            grep -qi "$pattern" report.md \
              || { echo "::error::report did not mention: $pattern"; cat report.md; exit 1; }
          done

  refuses-to-pass-on-nothing:
    name: an empty scan is an error, not a pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A linter whose globs match no files must say so. Reporting "fully
      # translated" for a project it never read is the one failure mode that
      # looks exactly like success.
      - id: check
        continue-on-error: true
        uses: ./
        with:
          config: .github/self-check/nothing.yml
          comment: false
          annotations: false

      - name: Assert it failed loudly
        run: |
          test "${{ steps.check.outcome }}" = "failure" \
            || { echo "::error::a scan that matched no files reported success"; exit 1; }
          test "${{ steps.check.outputs.passed }}" != "true" \
            || { echo "::error::a scan that matched no files set passed=true"; exit 1; }

  ratchet-separates-new-from-pre-existing:
    name: ratchet reports the backlog without blocking on it
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The comparison needs the base branch in the clone.
          fetch-depth: 0

      - id: check
        uses: ./
        with:
          config: .github/self-check/broken.yml
          mode: ratchet
          comment: false
          fail: false

      - name: Assert the backlog is reported, not blamed on this PR
        run: |
          test "${{ steps.check.outputs.pre-existing-count }}" -gt 0 \
            || { echo "::error::ratchet mode found no pre-existing issues in the broken fixtures"; exit 1; }
          cat <<'REPORT' > report.md
          ${{ steps.check.outputs.report }}
          REPORT
          grep -q 'Pre-existing issues' report.md \
            || { echo "::error::the report did not separate pre-existing issues"; cat report.md; exit 1; }

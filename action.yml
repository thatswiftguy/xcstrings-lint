name: 'xcstrings-lint'
description: 'Catch missing, duplicate and broken iOS translations before they merge'
author: 'thatswiftguy'
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  config:
    description: 'Path to config file'
    required: false
    default: '.xcstrings-lint.yml'
  mode:
    # Both modes read the whole repository and report everything. The only
    # difference is what blocks the merge.
    description: 'full (block on every issue) | ratchet (block only on issues this change introduced)'
    required: false
    default: 'full'
  threshold:
    description: 'Minimum coverage percent per language'
    required: false
    default: '100'
  comment:
    description: 'Post a sticky PR comment'
    required: false
    default: 'true'
  annotations:
    description: 'Emit inline file annotations'
    required: false
    default: 'true'
  fail:
    description: 'Exit non-zero when issues are found'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to post the PR comment'
    required: false
    default: ${{ github.token }}

outputs:
  passed:
    description: 'true | false'
  coverage:
    description: 'JSON object of language -> coverage percent'
  issue-count:
    description: 'Number of blocking (error-severity) issues'
  warning-count:
    description: 'Number of non-blocking issues'
  pre-existing-count:
    description: 'Issues the base branch already had'
  files-scanned:
    description: 'How many catalog files were read'
  report:
    description: 'Markdown report body'

runs:
  using: 'node20'
  main: 'dist/index.js'

name: 'xcstrings-lint'
description: 'Catch missing, duplicate and broken iOS translations before they merge'
author: 'thatswiftguy'
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  config:
    description: 'Path to config file'
    required: false
    default: '.xcstrings-lint.yml'
  threshold:
    description: 'Minimum coverage percent per language'
    required: false
    default: '100'
  comment:
    description: 'Post a sticky PR comment'
    required: false
    default: 'true'
  annotations:
    description: 'Emit inline file annotations'
    required: false
    default: 'true'
  fail:
    description: 'Exit non-zero when issues are found'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to post the PR comment'
    required: false
    default: ${{ github.token }}
  mode:
    # Declared only so a v1 workflow does not trip GitHub's "unexpected input"
    # warning. The check has no modes any more -- it always reads the whole
    # repository -- and setting this logs a notice telling you to delete it.
    description: 'Removed in v2. Every run checks the whole repository.'
    required: false
    deprecationMessage: 'The mode input was removed in v2; every run checks the whole repository.'

outputs:
  passed:
    description: 'true | false'
  coverage:
    description: 'JSON object of language -> coverage percent'
  issue-count:
    description: 'Number of blocking (error-severity) issues'
  warning-count:
    description: 'Number of non-blocking issues'
  files-scanned:
    description: 'How many catalog files were read'
  report:
    description: 'Markdown report body'

runs:
  using: 'node20'
  main: 'dist/index.js'
